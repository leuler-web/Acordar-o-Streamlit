name: UEA Streamlit Keeper

on:
  schedule:
    # Corre todos os dias às 10:00 UTC (06:00 AM Horário de Manaus)
    - cron: '0 10 * * *'
  workflow_dispatch:

jobs:
  rpa_wake_up:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Clonar o repositório atual
      uses: actions/checkout@v4.2.2

    - name: 🐍 Configurar o ambiente Python
      uses: actions/setup-python@v5.3.0
      with:
        python-version: '3.11'

    - name: 📦 Instalar dependências básicas
      run: |
        python -m pip install --upgrade pip
        pip install playwright

    - name: 🌐 Instalar o Navegador Chromium e dependências do sistema
      run: playwright install chromium --with-deps

    - name: 🤖 Executar o Script RPA
      run: python wake_up.py
      
    - name: 🛡️ Prevenir suspensão do Cron (Keepalive)
      uses: gautamkrishnar/keepalive-workflow@v2
